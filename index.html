<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match Viewer | Pro Football Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --panel-bg: #111827;
            --card-bg: #1a1a2e;
            --gold: #f0c040;
            --text-primary: #f0f0f0;
            --text-muted: #9ca3af;
            --pitch-green: #2d5a27;
            --team-a: #3b82f6;
            --team-b: #ef4444;
            --radius: 10px;
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            overflow-x: hidden;
            line-height: 1.4;
        }

        nav {
            background-color: var(--panel-bg);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--gold);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .pitch-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 2;
            background-color: var(--pitch-green);
            background-image: url('football_field.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border: 4px solid #fff;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 2rem;
            overflow: hidden;
        }

        .player-token {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            transition: transform 0.2s ease;
        }

        .player-token:hover {
            transform: translate(-50%, -50%) scale(1.1);
        }

        .player-token .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid white;
            object-fit: cover;
            background: #444;
        }

        .number-badge {
            position: absolute;
            bottom: 0;
            right: 0;
            background: var(--gold);
            color: #000;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #000;
        }

        .name-label {
            position: absolute;
            top: 110%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            white-space: nowrap;
            pointer-events: none;
        }

        .bench-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        .bench-panel {
            background: var(--panel-bg);
            padding: 1.5rem;
            border-radius: var(--radius);
            border-top: 4px solid var(--gold);
        }

        .bench-title {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
            border-bottom: 1px solid #333;
            padding-bottom: 0.5rem;
        }

        .player-card {
            background: var(--card-bg);
            padding: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid transparent;
        }

        .player-card:hover {
            background: #252545;
            border-color: var(--gold);
        }

        .card-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
        }

        .card-name {
            font-weight: 600;
            display: block;
        }

        .pos-badge {
            font-size: 0.7rem;
            padding: 2px 6px;
            background: #333;
            border-radius: 4px;
            color: var(--gold);
            font-weight: bold;
        }

        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: var(--panel-bg);
            width: 90%;
            max-width: 500px;
            border-radius: var(--radius);
            position: relative;
            padding: 2rem;
            border: 1px solid var(--gold);
        }

        .detail-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid var(--gold);
            margin-bottom: 1rem;
            object-fit: cover;
        }

        .detail-title {
            font-size: 2rem;
            color: var(--gold);
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 8px;
        }

        .stat-bar {
            margin-top: 10px;
        }

        .bar-bg {
            width: 100%;
            height: 8px;
            background: #333;
            border-radius: 4px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: var(--gold);
        }

        .player-token {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            position: absolute;
            transform: translate(-50%, -50%);
        }

        /* Team colors */
        .player-token.team-A {
            box-shadow: 0 0 0 3px #3b82f6;
            /* blue */
        }

        .player-token.team-B {
            box-shadow: 0 0 0 3px #ef4444;
            /* red */
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">PRO PITCH</div>
    </nav>

    <main>
        <div class="pitch-wrapper" id="pitch"></div>

        <div class="bench-container">
            <div class="bench-panel">
                <h3 class="bench-title">Team A Bench</h3>
                <div id="bench-A"></div>
            </div>
            <div class="bench-panel">
                <h3 class="bench-title">Team B Bench</h3>
                <div id="bench-B"></div>
            </div>
        </div>
    </main>

    <div class="modal-backdrop" id="modal-backdrop">
        <div class="modal-content">
            <div id="player-details"></div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = "football_match_data";
        let players = [];

        const POSITIONS = ["GK", "LB", "RB", "CB", "DMF", "LMF", "RMF", "CMF", "AMF", "LWF", "RWF", "SS", "CF"];

        function fillStats(p) {
            const def = { pace: 50, shooting: 50, passing: 50, dribbling: 50, defending: 50, physical: 50, vision: 50, stamina: 50, strength: 50, aggression: 50 };
            Object.keys(def).forEach(k => {
                if (typeof p[k] !== "number") p[k] = def[k];
            });
        }

        function getDefaultData() {
            return [];
        }

        function init() {
            try {
                const saved = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
                players = saved.players || [];
            } catch {
                players = getDefaultData();
            }
            players.forEach(fillStats);
            render();
        }

        function render() {
            document.getElementById("pitch").innerHTML = "";
            document.getElementById("bench-A").innerHTML = "";
            document.getElementById("bench-B").innerHTML = "";

            players.forEach(p => {
                if (p.status === "starter") {
                    const el = document.createElement("div");
                    el.className = "player-token";
                    el.style.position = "absolute";
                    el.style.left = p.pitchX + "%";
                    el.style.top = p.pitchY + "%";
                    el.innerHTML = `<img class="avatar" src="${p.image || 'Default.png'}"
     onerror="this.src='Default.png'"><div class="number-badge">${p.number}</div>`;
                    el.onclick = () => showDetails(p.id);
                    document.getElementById("pitch").appendChild(el);
                } else {
                    const el = document.createElement("div");
                    el.className = "player-card";
                    el.innerHTML = `<img class="card-avatar" src="${p.image || 'Default.png'}"
     onerror="this.src='Default.png'"><div><div class="card-name">${p.name}</div><span class="pos-badge">${p.position}</span></div>`;
                    el.onclick = () => showDetails(p.id);
                    document.getElementById("bench-" + p.team).appendChild(el);
                }
            });
        }

        function showDetails(id) {
            const p = players.find(x => x.id === id);
            const d = document.getElementById("player-details");

            d.innerHTML = `
    <img src="${p.image || 'Default.png'}"
     class="detail-img"
     onerror="this.src='Default.png'">
    <h2 class="detail-title">${p.name}</h2>
    <div class="detail-grid">
        <div>Position: ${p.position}</div>
        <div>Nationality: ${p.nationality}</div>
        <div>Goals: ${p.goals}</div>
        <div>Assists: ${p.assists}</div>
    </div>

    <h3 style="margin-top:15px;color:var(--gold)">Stats</h3>

    ${renderStat("PACE", p.pace)}
    ${renderStat("SHOOTING", p.shooting)}
    ${renderStat("PASSING", p.passing)}
    ${renderStat("DRIBBLING", p.dribbling)}
    ${renderStat("DEFENDING", p.defending)}
    ${renderStat("PHYSICAL", p.physical)}
    ${renderStat("VISION", p.vision)}
    ${renderStat("STAMINA", p.stamina)}
    ${renderStat("STRENGTH", p.strength)}
    ${renderStat("AGGRESSION", p.aggression)}
    `;

            document.getElementById("modal-backdrop").style.display = "flex";
        }

        function renderStat(label, value) {
            return `
    <div class="stat-bar">
        <div>${label} ${value}</div>
        <div class="bar-bg"><div class="bar-fill" style="width:${value}%"></div></div>
    </div>`;
        }

        function closeModal() {
            document.getElementById("modal-backdrop").style.display = "none";
        }

        document.getElementById("modal-backdrop").onclick = e => {
            if (e.target.id === "modal-backdrop") closeModal();
        };

        init();
    </script>

</body>

</html>
