<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match Viewer | Pro Football Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --panel-bg: #111827;
            --card-bg: #1a1a2e;
            --gold: #f0c040;
            --text-primary: #f0f0f0;
            --text-muted: #9ca3af;
            --pitch-green: #2d5a27;
            --team-a: #3b82f6;
            --team-b: #ef4444;
            --radius: 10px;
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            overflow-x: hidden;
            line-height: 1.4;
        }

        /* Navbar */
        nav {
            background-color: var(--panel-bg);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--gold);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .nav-links a {
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 600;
            padding: 0.5rem 1rem;
            border: 1px solid transparent;
            transition: var(--transition);
        }

        .nav-links a:hover {
            color: var(--gold);
            border-bottom-color: var(--gold);
        }

        /* Main Layout */
        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        /* Pitch Container */
        .pitch-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 2;
            background-color: var(--pitch-green);
            background-image: url('PitchBG.jpg');
            background-size: cover;
            background-position: center;
            border: 4px solid #fff;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 2rem;
            overflow: hidden;
        }

        /* Player Tokens */
        .player-token {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            transition: transform 0.2s ease;
        }

        .player-token:hover {
            transform: translate(-50%, -50%) scale(1.1);
        }

        .player-token .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid white;
            object-fit: cover;
            background: #444;
        }

        .player-token.team-A .avatar {
            border-color: var(--team-a);
        }

        .player-token.team-B .avatar {
            border-color: var(--team-b);
        }

        .number-badge {
            position: absolute;
            bottom: 0;
            right: 0;
            background: var(--gold);
            color: #000;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #000;
        }

        .name-label {
            position: absolute;
            top: 110%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            white-space: nowrap;
            pointer-events: none;
        }

        /* Bench Sections */
        .bench-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        .bench-panel {
            background: var(--panel-bg);
            padding: 1.5rem;
            border-radius: var(--radius);
            border-top: 4px solid var(--gold);
        }

        .bench-title {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
            border-bottom: 1px solid #333;
            padding-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .bench-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .player-card {
            background: var(--card-bg);
            padding: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid transparent;
        }

        .player-card:hover {
            background: #252545;
            border-color: var(--gold);
        }

        .card-avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
        }

        .card-info {
            flex-grow: 1;
        }

        .card-name {
            font-weight: 600;
            display: block;
        }

        .card-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .pos-badge {
            font-size: 0.7rem;
            padding: 2px 6px;
            background: #333;
            border-radius: 4px;
            color: var(--gold);
            font-weight: bold;
        }

        /* Modal */
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: var(--panel-bg);
            width: 90%;
            max-width: 500px;
            border-radius: var(--radius);
            position: relative;
            padding: 2rem;
            border: 1px solid var(--gold);
            animation: modalIn 0.3s ease-out;
        }

        @keyframes modalIn {
            from {
                transform: translateY(20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.5rem;
            color: var(--text-muted);
            cursor: pointer;
        }

        .close-modal:hover {
            color: var(--gold);
        }

        .detail-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .detail-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid var(--gold);
            margin-bottom: 1rem;
            object-fit: cover;
        }

        .detail-title {
            font-size: 2rem;
            color: var(--gold);
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 8px;
        }

        .detail-item span:first-child {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .detail-item span:last-child {
            font-size: 1.1rem;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .bench-container {
                grid-template-columns: 1fr;
            }

            .pitch-wrapper {
                aspect-ratio: 1 / 1.2;
                background-size: auto 100%;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo"><i class="fa-solid fa-circle-nodes"></i> PRO PITCH</div>
    </nav>

    <main>
        <div class="pitch-wrapper" id="pitch">
            <!-- Tokens injected here -->
        </div>

        <div class="bench-container">
            <div class="bench-panel">
                <h3 class="bench-title"><i class="fa-solid fa-shield-halved" style="color: var(--team-a)"></i> Team A
                    Bench</h3>
                <div class="bench-list" id="bench-A"></div>
            </div>
            <div class="bench-panel">
                <h3 class="bench-title"><i class="fa-solid fa-shield-halved" style="color: var(--team-b)"></i> Team B
                    Bench</h3>
                <div class="bench-list" id="bench-B"></div>
            </div>
        </div>
    </main>

    <div class="modal-backdrop" id="modal-backdrop">
        <div class="modal-content" id="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <div id="player-details">
                <!-- Details injected here -->
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = "football_match_data";
        let players = [];

        function getDefaultData() {
            const data = [];
            const teams = ["A", "B"];
            const positions = ["GK", "DEF", "DEF", "MID", "MID", "FWD"];
            const nationalities = ["England", "Brazil", "France", "Germany", "Spain", "Argentina", "Italy", "Portugal", "Netherlands", "Japan"];

            let id = 1;
            teams.forEach(team => {
                // Starters
                positions.forEach((pos, idx) => {
                    let px, py;
                    if (team === "A") {
                        py = 90 - (idx * 6);
                        px = 50 + (idx % 2 === 0 ? idx * 10 : -idx * 10);
                        if (pos === "GK") { px = 50; py = 92; }
                        if (pos === "FWD") { px = 50; py = 55; }
                    } else {
                        py = 10 + (idx * 6);
                        px = 50 + (idx % 2 === 0 ? idx * 10 : -idx * 10);
                        if (pos === "GK") { px = 50; py = 8; }
                        if (pos === "FWD") { px = 50; py = 45; }
                    }

                    data.push({
                        id: id,
                        name: `Player ${id} Fullname`,
                        number: Math.floor(Math.random() * 98) + 1,
                        position: pos,
                        team: team,
                        status: "starter",
                        pitchX: px,
                        pitchY: py,
                        image: `https://i.pravatar.cc/150?img=${id}`,
                        age: 20 + Math.floor(Math.random() * 15),
                        nationality: nationalities[Math.floor(Math.random() * nationalities.length)],
                        appearances: Math.floor(Math.random() * 100),
                        goals: Math.floor(Math.random() * 50),
                        assists: Math.floor(Math.random() * 30)
                    });
                    id++;
                });

                // Substitutes
                for (let i = 0; i < 6; i++) {
                    data.push({
                        id: id,
                        name: `Sub ${id} Name`,
                        number: Math.floor(Math.random() * 98) + 1,
                        position: positions[i % positions.length],
                        team: team,
                        status: "substitute",
                        pitchX: null,
                        pitchY: null,
                        image: `https://i.pravatar.cc/150?img=${id}`,
                        age: 18 + Math.floor(Math.random() * 18),
                        nationality: nationalities[Math.floor(Math.random() * nationalities.length)],
                        appearances: Math.floor(Math.random() * 50),
                        goals: Math.floor(Math.random() * 10),
                        assists: Math.floor(Math.random() * 10)
                    });
                    id++;
                }
            });
            return data;
        }

        function init() {
            try {
                const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
                if (saved && Array.isArray(saved) && saved.length > 0) {
                    players = saved;
                } else {
                    players = getDefaultData();
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(players));
                }
            } catch (e) {
                players = getDefaultData();
            }
            renderApp();
        }

        function renderApp() {
            const pitch = document.getElementById('pitch');
            const benchA = document.getElementById('bench-A');
            const benchB = document.getElementById('bench-B');

            pitch.innerHTML = '';
            benchA.innerHTML = '';
            benchB.innerHTML = '';

            players.forEach(p => {
                if (p.status === "starter") {
                    const token = document.createElement('div');
                    token.className = `player-token team-${p.team}`;
                    token.style.left = p.pitchX + "%";
                    token.style.top = p.pitchY + "%";
                    token.style.transform = "translate(-50%, -50%)";
                    token.style.position = "absolute";

                    token.innerHTML = `
                    <img src="${p.image}" class="avatar" onerror="this.src='https://i.pravatar.cc/150?img=${p.id}'">
                    <div class="number-badge">${p.number}</div>
                    <div class="name-label">${p.name}</div>
                `;
                    token.onclick = () => showDetails(p.id);
                    pitch.appendChild(token);
                } else {
                    const card = document.createElement('div');
                    card.className = 'player-card';
                    card.innerHTML = `
                    <img src="${p.image}" class="card-avatar" onerror="this.src='https://i.pravatar.cc/150?img=${p.id}'">
                    <div class="card-info">
                        <span class="card-name">${p.name}</span>
                        <div class="card-meta">#${p.number} • <span class="pos-badge">${p.position}</span></div>
                    </div>
                `;
                    card.onclick = () => showDetails(p.id);
                    document.getElementById(`bench-${p.team}`).appendChild(card);
                }
            });
        }

        function showDetails(id) {
            const p = players.find(x => x.id === id);
            if (!p) return;

            const detailDiv = document.getElementById('player-details');
            detailDiv.innerHTML = `
            <div class="detail-header">
                <img src="${p.image}" class="detail-img" onerror="this.src='https://i.pravatar.cc/150?img=${p.id}'">
                <h2 class="detail-title">${p.name}</h2>
                <p style="color:var(--text-muted)">Team ${p.team} • #${p.number}</p>
            </div>
            <div class="detail-grid">
                <div class="detail-item"><span>Position</span><span>${p.position}</span></div>
                <div class="detail-item"><span>Nationality</span><span>${p.nationality}</span></div>
                <div class="detail-item"><span>Age</span><span>${p.age}</span></div>
                <div class="detail-item"><span>Appearances</span><span>${p.appearances}</span></div>
                <div class="detail-item"><span>Goals</span><span>${p.goals}</span></div>
                <div class="detail-item"><span>Assists</span><span>${p.assists}</span></div>
            </div>
        `;
            document.getElementById('modal-backdrop').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal-backdrop').style.display = 'none';
        }

        window.onclick = (e) => {
            if (e.target === document.getElementById('modal-backdrop')) closeModal();
        };

        window.onkeydown = (e) => {
            if (e.key === "Escape") closeModal();
        };

        init();
    </script>
</body>

</html>
